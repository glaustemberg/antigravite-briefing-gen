<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="80" height="80" rx="18" fill="url(#grad1)"/>
  <!-- Document shape -->
  <rect x="20" y="16" width="34" height="42" rx="4" fill="white" opacity="0.15"/>
  <rect x="20" y="16" width="34" height="42" rx="4" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <!-- Document lines -->
  <line x1="27" y1="28" x2="46" y2="28" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="27" y1="34" x2="46" y2="34" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="27" y1="40" x2="38" y2="40" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Upward arrow / spark - floating element -->
  <circle cx="55" cy="26" r="12" fill="url(#grad2)" filter="url(#glow)"/>
  <path d="M55 31 L55 21 M51 25 L55 21 L59 25" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
